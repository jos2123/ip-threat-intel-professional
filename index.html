<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureTrace - IP Threat Intelligence</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand" onclick="goHome()" style="cursor: pointer;">
            <svg class="brand-icon" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="36" height="36" rx="8" fill="#0f172a"/>
                <path d="M18 5L7 10.5v7.5c0 7.35 4.7 14.25 11 16.5 6.3-2.25 11-9.15 11-16.5v-7.5L18 5z" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
                <path d="M18 8.5L10 12.5v5.5c0 5.6 3.4 10.8 8 12.5V8.5z" fill="#3b82f6" fill-opacity="0.3"/>
                <circle cx="18" cy="17" r="4" fill="none" stroke="#3b82f6" stroke-width="2"/>
                <circle cx="18" cy="17" r="1.5" fill="#3b82f6"/>
                <path d="M18 11v2M18 22v2M13 17h2M21 17h2" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <span>SecureTrace</span>
        </div>
        <div class="nav-links">
            <a href="#" class="active" onclick="goHome(); return false;">Analysis</a>
            <a href="#" onclick="showBlockedList(); return false;">Blocked IPs</a>
            <a href="#" onclick="generateBlocklist(); return false;">Export</a>
        </div>
    </nav>

    <main class="main-content">
        <section class="hero">
            <h1>IP Threat Intelligence</h1>
            <p>Advanced threat detection and network security analysis</p>
        </section>

        <section class="search-section">
            <div class="search-container">
                <label for="ipInput">Enter IP addresses for analysis</label>
                <div class="input-wrapper">
                    <textarea id="ipInput" placeholder="Enter one or more IP addresses separated by commas or new lines&#10;Example: 8.8.8.8, 1.1.1.1" rows="3"></textarea>
                </div>
                <div class="action-bar">
                    <button id="analyzeBtn" class="btn-primary" onclick="analyzeIPs()">
                        <span class="btn-text">Run Analysis</span>
                    </button>
                    <div class="secondary-actions">
                        <button class="btn-secondary" onclick="showBlockedList()">View Blocked</button>
                        <button class="btn-secondary" onclick="generateBlocklist()">AWS WAF Export</button>
                    </div>
                </div>
            </div>
        </section>

        <div id="loading" class="loading-state" style="display: none;">
            <div class="spinner"></div>
            <p>Analyzing IP addresses...</p>
        </div>

        <div id="error" class="error-state" style="display: none;"></div>

        <section id="results" class="results-section" style="display: none;"></section>
    </main>

    <footer class="footer">
        <p>IP Threat Intelligence Platform &copy; 2026</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
