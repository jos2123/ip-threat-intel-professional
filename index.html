<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Inteligencia de Amenazas IP</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Sistema de Inteligencia de Amenazas IP</h1>
            <p>Plataforma Avanzada de Análisis y Detección de Amenazas</p>
            <p><small>Ingrese múltiples direcciones IP (una por línea) o use Ctrl+Enter para analizar</small></p>
        </header>

        <div class="search-box">
            <div class="input-group">
                <textarea id="ipInput" placeholder="Ingrese direcciones IP separadas por líneas o comas:
8.8.8.8, 1.1.1.1
o
8.8.8.8
1.1.1.1" rows="4"></textarea>
                <button id="analyzeBtn" onclick="analyzeIPs()">Analizar</button>
            </div>
            <div style="margin-top: 15px; text-align: center;">
                <button onclick="showBlockedList()" style="background: #dc3545; padding: 10px 20px;">Ver Lista Bloqueada</button>
                <button onclick="generateBlocklist()" style="background: #6c757d; padding: 10px 20px; margin-left: 10px;">Generar Lista AWS</button>
            </div>
        </div>

        <div id="loading" class="loading" style="display: none;">
            <p>Analyzing IP addresses...</p>
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div id="results" class="results"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
