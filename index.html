<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Threat Intelligence Platform</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand" onclick="goHome()" style="cursor: pointer;">
            <svg class="brand-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="32" height="32" rx="8" fill="#3b82f6"/>
                <path d="M16 6L8 10v6c0 5.25 3.4 10.15 8 12 4.6-1.85 8-6.75 8-12v-6l-8-4z" fill="#1e40af"/>
                <path d="M16 8L10 11v5c0 4.2 2.7 8.1 6 9.6V8z" fill="#60a5fa"/>
                <circle cx="16" cy="16" r="3" fill="white"/>
            </svg>
            <span>ThreatIntel</span>
        </div>
        <div class="nav-links">
            <a href="#" class="active" onclick="goHome(); return false;">Analysis</a>
            <a href="#" onclick="showBlockedList(); return false;">Blocked IPs</a>
            <a href="#" onclick="generateBlocklist(); return false;">Export</a>
        </div>
    </nav>

    <main class="main-content">
        <section class="hero">
            <h1>IP Threat Intelligence Platform</h1>
            <p>Enterprise-grade threat analysis and IP reputation monitoring</p>
        </section>

        <section class="search-section">
            <div class="search-container">
                <label for="ipInput">Enter IP addresses for analysis</label>
                <div class="input-wrapper">
                    <textarea id="ipInput" placeholder="Enter one or more IP addresses separated by commas or new lines&#10;Example: 8.8.8.8, 1.1.1.1" rows="3"></textarea>
                </div>
                <div class="action-bar">
                    <button id="analyzeBtn" class="btn-primary" onclick="analyzeIPs()">
                        <span class="btn-text">Run Analysis</span>
                    </button>
                    <div class="secondary-actions">
                        <button class="btn-secondary" onclick="showBlockedList()">View Blocked</button>
                        <button class="btn-secondary" onclick="generateBlocklist()">AWS WAF Export</button>
                    </div>
                </div>
            </div>
        </section>

        <div id="loading" class="loading-state" style="display: none;">
            <div class="spinner"></div>
            <p>Analyzing IP addresses...</p>
        </div>

        <div id="error" class="error-state" style="display: none;"></div>

        <section id="results" class="results-section" style="display: none;"></section>
    </main>

    <footer class="footer">
        <p>IP Threat Intelligence Platform &copy; 2026</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
